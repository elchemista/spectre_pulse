name: CI

on:
  push:
    branches:
      - main
      - feature/stack-tools-0.4
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"

jobs:
  test:
    name: Test and Credo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: feature/agent-server-gam
          path: _compat/spectre
          persist-credentials: false

      - name: Check out compatible spectre_beam
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_beam
          ref: feature/stack-tools-0.4
          path: _compat/spectre_beam
          persist-credentials: false

      - name: Check out compatible spectre_directive
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_directive
          ref: feature/stack-tools-0.4
          path: _compat/spectre_directive
          persist-credentials: false

      - name: Check out compatible spectre_kinetic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_kinetic
          ref: feature/stack-tools-0.4
          path: _compat/spectre_kinetic
          persist-credentials: false

      - name: Check out compatible spectre_lens
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_lens
          ref: feature/stack-tools-0.4
          path: _compat/spectre_lens
          persist-credentials: false

      - name: Check out compatible spectre_mnemonic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_mnemonic
          ref: feature/stack-tools-0.4
          path: _compat/spectre_mnemonic
          persist-credentials: false

      - name: Check out compatible spectre_prism
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_prism
          ref: feature/stack-tools-0.4
          path: _compat/spectre_prism
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          echo "SPECTRE_PATH=$GITHUB_WORKSPACE/_compat/spectre" >> "$GITHUB_ENV"
          echo "SPECTRE_BEAM_PATH=$GITHUB_WORKSPACE/_compat/spectre_beam" >> "$GITHUB_ENV"
          echo "SPECTRE_DIRECTIVE_PATH=$GITHUB_WORKSPACE/_compat/spectre_directive" >> "$GITHUB_ENV"
          echo "SPECTRE_KINETIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_kinetic" >> "$GITHUB_ENV"
          echo "SPECTRE_LENS_PATH=$GITHUB_WORKSPACE/_compat/spectre_lens" >> "$GITHUB_ENV"
          echo "SPECTRE_MNEMONIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_mnemonic" >> "$GITHUB_ENV"
          echo "SPECTRE_PRISM_PATH=$GITHUB_WORKSPACE/_compat/spectre_prism" >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Run Credo (non-strict)
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: feature/agent-server-gam
          path: _compat/spectre
          persist-credentials: false

      - name: Check out compatible spectre_beam
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_beam
          ref: feature/stack-tools-0.4
          path: _compat/spectre_beam
          persist-credentials: false

      - name: Check out compatible spectre_directive
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_directive
          ref: feature/stack-tools-0.4
          path: _compat/spectre_directive
          persist-credentials: false

      - name: Check out compatible spectre_kinetic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_kinetic
          ref: feature/stack-tools-0.4
          path: _compat/spectre_kinetic
          persist-credentials: false

      - name: Check out compatible spectre_lens
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_lens
          ref: feature/stack-tools-0.4
          path: _compat/spectre_lens
          persist-credentials: false

      - name: Check out compatible spectre_mnemonic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_mnemonic
          ref: feature/stack-tools-0.4
          path: _compat/spectre_mnemonic
          persist-credentials: false

      - name: Check out compatible spectre_prism
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_prism
          ref: feature/stack-tools-0.4
          path: _compat/spectre_prism
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          echo "SPECTRE_PATH=$GITHUB_WORKSPACE/_compat/spectre" >> "$GITHUB_ENV"
          echo "SPECTRE_BEAM_PATH=$GITHUB_WORKSPACE/_compat/spectre_beam" >> "$GITHUB_ENV"
          echo "SPECTRE_DIRECTIVE_PATH=$GITHUB_WORKSPACE/_compat/spectre_directive" >> "$GITHUB_ENV"
          echo "SPECTRE_KINETIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_kinetic" >> "$GITHUB_ENV"
          echo "SPECTRE_LENS_PATH=$GITHUB_WORKSPACE/_compat/spectre_lens" >> "$GITHUB_ENV"
          echo "SPECTRE_MNEMONIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_mnemonic" >> "$GITHUB_ENV"
          echo "SPECTRE_PRISM_PATH=$GITHUB_WORKSPACE/_compat/spectre_prism" >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer
