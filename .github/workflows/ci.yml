name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"

jobs:
  test:
    name: Test and Credo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: affe0b6ee33c957bc9aff9eec70cf7e7c33e80d6
          path: _compat/spectre
          persist-credentials: false

      - name: Check out compatible spectre_beam
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_beam
          ref: 88e8b017ce3d94dd4f0a2d8743ce767e1fe2ff17
          path: _compat/spectre_beam
          persist-credentials: false

      - name: Check out compatible spectre_directive
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_directive
          ref: 3972944a0d42720896b3ca2a6ef68633a4fe1bac
          path: _compat/spectre_directive
          persist-credentials: false

      - name: Check out compatible spectre_kinetic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_kinetic
          ref: 30896afb013eac6c3230465a24dcc15fef800750
          path: _compat/spectre_kinetic
          persist-credentials: false

      - name: Check out compatible spectre_lens
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_lens
          ref: e264af2fd48ac45976f2d3c7a6eb62dea4e41f9a
          path: _compat/spectre_lens
          persist-credentials: false

      - name: Check out compatible spectre_mnemonic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_mnemonic
          ref: 9dc95657976254c14189af63fa651b5ab5726a6e
          path: _compat/spectre_mnemonic
          persist-credentials: false

      - name: Check out compatible spectre_prism
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_prism
          ref: 877a252bd539927ed652ad2d7876e9b6f961a6ae
          path: _compat/spectre_prism
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          {
            echo "SPECTRE_PATH=$GITHUB_WORKSPACE/_compat/spectre"
            echo "SPECTRE_BEAM_PATH=$GITHUB_WORKSPACE/_compat/spectre_beam"
            echo "SPECTRE_DIRECTIVE_PATH=$GITHUB_WORKSPACE/_compat/spectre_directive"
            echo "SPECTRE_KINETIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_kinetic"
            echo "SPECTRE_LENS_PATH=$GITHUB_WORKSPACE/_compat/spectre_lens"
            echo "SPECTRE_MNEMONIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_mnemonic"
            echo "SPECTRE_PRISM_PATH=$GITHUB_WORKSPACE/_compat/spectre_prism"
          } >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Run Credo (non-strict)
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: affe0b6ee33c957bc9aff9eec70cf7e7c33e80d6
          path: _compat/spectre
          persist-credentials: false

      - name: Check out compatible spectre_beam
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_beam
          ref: 88e8b017ce3d94dd4f0a2d8743ce767e1fe2ff17
          path: _compat/spectre_beam
          persist-credentials: false

      - name: Check out compatible spectre_directive
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_directive
          ref: 3972944a0d42720896b3ca2a6ef68633a4fe1bac
          path: _compat/spectre_directive
          persist-credentials: false

      - name: Check out compatible spectre_kinetic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_kinetic
          ref: 30896afb013eac6c3230465a24dcc15fef800750
          path: _compat/spectre_kinetic
          persist-credentials: false

      - name: Check out compatible spectre_lens
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_lens
          ref: e264af2fd48ac45976f2d3c7a6eb62dea4e41f9a
          path: _compat/spectre_lens
          persist-credentials: false

      - name: Check out compatible spectre_mnemonic
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_mnemonic
          ref: 9dc95657976254c14189af63fa651b5ab5726a6e
          path: _compat/spectre_mnemonic
          persist-credentials: false

      - name: Check out compatible spectre_prism
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_prism
          ref: 877a252bd539927ed652ad2d7876e9b6f961a6ae
          path: _compat/spectre_prism
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          {
            echo "SPECTRE_PATH=$GITHUB_WORKSPACE/_compat/spectre"
            echo "SPECTRE_BEAM_PATH=$GITHUB_WORKSPACE/_compat/spectre_beam"
            echo "SPECTRE_DIRECTIVE_PATH=$GITHUB_WORKSPACE/_compat/spectre_directive"
            echo "SPECTRE_KINETIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_kinetic"
            echo "SPECTRE_LENS_PATH=$GITHUB_WORKSPACE/_compat/spectre_lens"
            echo "SPECTRE_MNEMONIC_PATH=$GITHUB_WORKSPACE/_compat/spectre_mnemonic"
            echo "SPECTRE_PRISM_PATH=$GITHUB_WORKSPACE/_compat/spectre_prism"
          } >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer
